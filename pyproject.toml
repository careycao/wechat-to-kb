[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-to-kb"
version = "1.1.0"
description = "把微信公众号、网页、视频、小红书、RSS 统一沉淀进本地知识库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["wechat", "knowledge-base", "mcp", "llm", "rag", "公众号", "知识库"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.3",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "jieba>=0.42.0",
    "yt-dlp>=2024.10.0",
]
rss = [
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
]
value-check = [
    "anthropic>=0.39.0",
]
dev = [
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]
all = [
    "mcp>=1.3",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "jieba>=0.42.0",
    "yt-dlp>=2024.10.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0",
    "anthropic>=0.39.0",
]

[project.urls]
Homepage = "https://github.com/zima-explorer/wechat-to-kb"
Repository = "https://github.com/zima-explorer/wechat-to-kb"
Issues = "https://github.com/zima-explorer/wechat-to-kb/issues"

[project.scripts]
wechat-to-kb-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scratch*"]

[tool.setuptools]
py-modules = ["unified_collector", "feishu_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
